<basis core="group" if="'[##cms.cms.page_index##]' = 'نمایه پیش فرض'">
    <header class="w-full fixed z-40 top-0 right-0">
        <div class="flex h-[56px] items-center bg-secondary-1-500 justify-center w-full ">
            <p class="text-white font-bold text-sm">
                قیمت های درج شده مخصوص همکاران آژانسی (b2b) می باشد.
            </p>
        </div>
        <div class="flex shadow-1 w-full bg-white h-[77px] items-center justify-center">
            <div class="px-4 w-full lg:px-4 xl:!w-[1280px] xl:!px-0 flex items-center justify-between">
                <div class="flex items-center gap-6">
                    <a href="/"
                        class="flex text-zinc-600 hover:text-zinc-900 relative text-sm group items-center gap-1">
                        <span class="grayscale group-hover:grayscale-0">
                            <img src="[##cms.cms.cdn##]/images/home.svg" alt="خانه" width="48" height="48">
                        </span>
                        خانه

                        <span
                            class="w-full left-0 opacity-0 group-hover:opacity-100 bg-secondary-2-600 absolute top-[122%] h-1 rounded-t-[4px]"></span>
                    </a>



                    <a href="/درباره-ما"
                        class="flex text-zinc-600 hover:text-zinc-900 relative text-sm group items-center gap-1">
                        <span class="grayscale group-hover:grayscale-0">
                            <img width="48" height="48" src="[##cms.cms.cdn##]/images/about us.svg" alt="درباره-ما">
                        </span>
                        درباره ما

                        <span
                            class="w-full left-0 opacity-0 group-hover:opacity-100 bg-secondary-2-600 absolute top-[122%] h-1 rounded-t-[4px]"></span>
                    </a>

                    <div
                        class="Login_Information h-12 justify-center items-center flex gap-1 whitespace-nowrap text-zinc-600 hover:text-zinc-900">
                        <basis core="call" file="authentication/modal"></basis>
                    </div>
                </div>
                <a href="/" aria-label="logo" class="hover:drop-shadow-lg">
                    <img loading="lazy" width="257" height="81" src="[##cms.cms.cdn##]/images/logo.png" alt="logo"
                        class="w-[171px]" />
                </a>
            </div>
        </div>
    </header>
</basis>


<basis core="group" if="'[##cms.cms.page_index##]' = 'موبایل'">
    <basis core="call" file="header.inc" lid="1" pageindex="[##cms.cms.pageindex##]"></basis>
</basis>
